name: MUHU Python package source and release contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-and-sdist:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated packaging tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'setuptools>=77,<90' 'wheel>=0.45,<1'
      - name: Compile Python
        run: python -B -m compileall -q muhu research tests
      - name: Full application contract
        run: python -B -m unittest discover -s tests -q
      - name: Original research controls
        run: python -B -m unittest discover -s research/tests -q
      - name: Verify deterministic source fixtures
        run: |
          python -B -m muhu.verify --public-dir dataset
          python -B -m research.muhu_v3.verify --public-dir dataset/v3
      - name: Build source and wheel
        run: python -m build --sdist --wheel --no-isolation
      - name: Check PyPI metadata
        run: python -m twine check dist/*
      - name: Ensure distribution has no private research or training data
        run: python -B release/check_distributions.py
      - name: Install wheel in separate environment
        run: |
          python -m venv /tmp/szl-muhu-wheel
          /tmp/szl-muhu-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/szl-muhu-wheel/bin/python -m muhu.cli --source-bound true --sample-n 32 --age-days 2 --independent-check true --contradiction false > muhu-smoke.json
          /tmp/szl-muhu-wheel/bin/python -c 'import json; d=json.load(open("/tmp/muhu-smoke.json")); assert d["state"]=="REVIEWABLE" and d["clinical_qualified"] is False and d["training_authorized"] is False'
