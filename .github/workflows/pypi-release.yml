name: MUHU Trusted PyPI Release (human-gated)
on:
  push:
    tags:
      - "muhu-v0.1.0"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require canonical protected-main release tag
        run: |
          test "$GITHUB_REF_NAME" = 'muhu-v0.1.0'
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
          python -c 'import tomllib; d=tomllib.load(open("pyproject.toml","rb")); assert d["project"]["name"]=="szl-muhu-evidence" and d["project"]["version"]=="0.1.0"'
      - name: Install audited packaging tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'setuptools>=77,<90' 'wheel>=0.45,<1'
      - name: Full source, scientific HOLD and metadata controls
        run: |
          python -B -m unittest discover -s tests -q
          python -B -m unittest discover -s research/tests -q
          python -B -m muhu.verify --public-dir dataset
          python -B -m research.muhu_v3.verify --public-dir dataset/v3
      - name: Build and inspect
        run: |
          python -m build --sdist --wheel --no-isolation
          python -m twine check dist/*
          python -B release/check_distributions.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-muhu-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-muhu-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          verbose: false
