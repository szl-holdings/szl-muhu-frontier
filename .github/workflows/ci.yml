name: python-muhu-source-and-data-verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -B -m compileall -q muhu app.py
      - name: Offline negative and positive control suite
        run: python -B -m unittest discover -s tests -v
      - name: Verify exact public training rows and private-split hashes
        run: python -B -m muhu.verify --public-dir dataset
      - name: Confirm clinical readiness remains denied
        run: grep -q 'INDEPENDENT_EVALUATION_AND_OWNER_TRAINING_ADMISSION_HOLD' muhu/server.py
