name: python-muhu-source-and-data-verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -B -m compileall -q muhu research app.py
      - name: Offline negative and positive control suite
        run: python -B -m unittest discover -s tests -v
      - name: Offline v3 research and leakage controls
        run: python -B -m unittest discover -s research/tests -v
      - name: Verify exact v2 public training rows and private-split hashes
        run: python -B -m muhu.verify --public-dir dataset
      - name: Verify v3 balanced source-only research dataset
        run: python -B -m research.muhu_v3.verify --public-dir dataset/v3
      - name: Confirm clinical readiness remains denied
        run: grep -q 'INDEPENDENT_EVALUATION_AND_OWNER_TRAINING_ADMISSION_HOLD' muhu/server.py
