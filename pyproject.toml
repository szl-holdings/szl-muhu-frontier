[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-muhu-evidence"
version = "0.1.0"
description = "Source-bound, nonclinical research-method evidence gates in pure Python"
readme = { file = "docs/PYPI_README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SZL Holdings" }]
keywords = ["reproducibility", "research", "provenance", "evidence", "methodology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Source = "https://github.com/szl-holdings/szl-muhu-frontier"
Documentation = "https://github.com/szl-holdings/szl-muhu-frontier/blob/main/docs/PYPI_README.md"
Research-preview = "https://huggingface.co/spaces/SZLHOLDINGS/szl-muhu-frontier"
Provenance = "https://github.com/szl-holdings/szl-muhu-frontier/blob/main/research/CLAIM_EVIDENCE_FIREWALL_V1.md"

[project.scripts]
muhu-witness = "muhu.cli:main"

[tool.setuptools]
packages = ["muhu"]
include-package-data = false

[tool.setuptools.exclude-package-data]
"*" = ["*.jsonl", "*.pem", "*.key", "*.pkl", "*.pt", "*.safetensors"]
